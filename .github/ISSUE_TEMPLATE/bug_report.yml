name: Bug report
description: Report reproducible behavior that is not security-sensitive
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: GuildGate version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use test data. Do not include credentials or user data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
